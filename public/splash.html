<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HelM</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #f4f7fa;
        color: #0f172a;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }

      body {
        display: grid;
        place-items: center;
      }

      .splash {
        display: grid;
        justify-items: center;
        gap: 12px;
      }

      .mark {
        width: 52px;
        height: 52px;
        display: block;
        border-radius: 12px;
        box-shadow: 0 12px 28px rgba(37, 99, 235, 0.24);
      }

      .title {
        display: grid;
        justify-items: center;
        gap: 4px;
      }

      strong {
        font-size: 18px;
        line-height: 22px;
      }

      span {
        color: #64748b;
        font-size: 12px;
        line-height: 16px;
      }
    </style>
  </head>
  <body>
    <main class="splash" role="status" aria-live="polite">
      <img class="mark" src="./Helm_icon.svg" alt="" aria-hidden="true" />
      <div class="title">
        <strong>HelM</strong>
        <span>正在启动...</span>
      </div>
    </main>
  </body>
</html>
