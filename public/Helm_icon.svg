<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient: Clean White / Apple Silver -->
    <linearGradient id="bgLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e5e7eb"/> <!-- gray-200 -->
    </linearGradient>

    <!-- Theme Color Gradient for HelM (Azure to Ocean Blue) -->
    <linearGradient id="helmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/> <!-- sky-400 -->
      <stop offset="100%" stop-color="#2563eb"/> <!-- blue-600 -->
    </linearGradient>
    
    <linearGradient id="hubGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- Soft Drop Shadow for Light Mode -->
    <filter id="shadowLight" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1e3a8a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- App Icon Base: Bright Rounded Rect -->
  <rect x="40" y="40" width="432" height="432" rx="100" ry="100" fill="url(#bgLight)" filter="url(#shadowLight)"/>
  <!-- Bevel highlights and borders -->
  <rect x="40" y="40" width="432" height="432" rx="100" ry="100" fill="none" stroke="#ffffff" stroke-width="6"/>
  <rect x="43" y="43" width="426" height="426" rx="97" ry="97" fill="none" stroke="#d1d5db" stroke-width="1"/>

  <!-- Minimalist HelM Graphic -->
  <g transform="translate(256, 256)" filter="url(#softShadow)">
    
    <!-- 8 Spokes -->
    <g stroke="url(#helmGrad)" stroke-width="16" stroke-linecap="round">
      <line x1="0" y1="-120" x2="0" y2="120" />
      <line x1="-120" y1="0" x2="120" y2="0" />
      <line x1="-85" y1="-85" x2="85" y2="85" />
      <line x1="-85" y1="85" x2="85" y2="-85" />
    </g>

    <!-- HelM Outer Ring -->
    <circle cx="0" cy="0" r="85" fill="none" stroke="url(#helmGrad)" stroke-width="24"/>
    
    <!-- HelM Inner Cutout (to make it look thick but hollow) -->
    <circle cx="0" cy="0" r="73" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.5"/>

    <!-- Center Hub Outer -->
    <circle cx="0" cy="0" r="32" fill="#ffffff"/>
    
    <!-- Center Hub Inner Glowing Core -->
    <circle cx="0" cy="0" r="16" fill="url(#hubGrad)"/>
    
    <!-- Central tiny dot -->
    <circle cx="0" cy="0" r="6" fill="#ffffff"/>
  </g>
</svg>
